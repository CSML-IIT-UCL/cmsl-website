blockers:
  - kind: missing-portraits
    source_page: https://csml.iit.it/people
    note: IIT currently publishes its generic logo instead of a portrait for the other listed people; the new site uses text initials rather than mislabelling that logo as a portrait.
  - kind: project-logos
    source_page: https://csml.iit.it/funded-projects
    note: The four verified project records do not expose approved reusable project/funder logo files; cards therefore use text identities without invented logos.
  - kind: missing-portraits
    source_page: http://www.andreas-maurer.eu/
    note: The only photo on Andreas Maurer's personal site is a distant mountaineering snapshot ("on the summit"), not a usable headshot; his profile uses the text-initials fallback rather than publishing an unrelated image.
